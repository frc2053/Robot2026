name: PR Lint Report Comment

on:
  workflow_run:
    workflows: ["Build Robot Code"]
    types:
      - completed

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Comment PR with lint results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = '## 🤖 Code Quality Report\n\n';

            // Check if artifacts were downloaded
            const hasCheckstyle = fs.existsSync('checkstyle-reports');
            const hasPmd = fs.existsSync('pmd-reports');

            if (!hasCheckstyle && !hasPmd) {
              comment += '✅ All code quality checks passed!\n';
            } else {
              comment += '⚠️ Some code quality issues were found. Check the workflow artifacts for detailed reports.\n\n';
              if (hasCheckstyle) comment += '- Checkstyle report available\n';
              if (hasPmd) comment += '- PMD report available\n';
            }

            comment += '\n[View full workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})';

            // Find the PR number
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: '${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}'
            });

            if (pullRequests.length > 0) {
              const pr = pullRequests[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment
              });
            }
